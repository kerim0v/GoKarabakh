<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050807">
  <title>GoKarabakh / Field notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">G</span><span>GOKARABAKH</span></a><nav class="nav" aria-label="Primary navigation"><a href="index.html">Explore</a><a href="dashboard.html">Stay</a><a class="active" href="community.html">Community</a></nav><div class="wallet"><span class="wallet-icon">◈</span><b>1,240</b><span class="mono">coins</span></div></header>
    <main class="community-main">
      <section class="community-hero reveal"><div><span class="eyebrow mono">Field notes / 03</span><h1>Seen through<br>your eyes.</h1></div><p>Small moments from a shared map. Add your own coordinates and help the next traveller look closer.</p></section>
      <section class="community-layout">
        <div class="photo-grid" aria-label="Community photo gallery">
          <figure class="photo-tile reveal delay-1"><img src="https://images.unsplash.com/photo-1596402184320-417e7178b2cd?auto=format&fit=crop&w=1100&q=85" alt="Misty green mountains in Karabakh"><figcaption><span>@aysel.travels</span><span class="mono">Tartar / 06:42</span></figcaption></figure>
          <figure class="photo-tile reveal delay-2"><img src="https://images.unsplash.com/photo-1533130061792-64b345e4a833?auto=format&fit=crop&w=800&q=85" alt="Ancient stone architecture"><figcaption><span>@nadirnorth</span><span class="mono">Shusha</span></figcaption></figure>
          <figure class="photo-tile reveal delay-3"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=85" alt="Hiking trail through a green valley"><figcaption><span>@leyla.frames</span><span class="mono">Lachin</span></figcaption></figure>
          <figure class="photo-tile reveal delay-1"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=85" alt="Sunlight over a valley"><figcaption><span>@safar.notes</span><span class="mono">Kalbajar</span></figcaption></figure>
          <figure class="photo-tile reveal delay-2"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1100&q=85" alt="Snowy mountain ridge beneath clouds"><figcaption><span>@samir.road</span><span class="mono">Murovdag</span></figcaption></figure>
        </div>
        <aside class="upload-panel glass reveal delay-3"><span class="eyebrow mono">Add to the atlas</span><h3>Leave a trace.</h3><p>Share one frame from your route and receive 50 GoKarabakh coins.</p><form class="share-form" id="share-form"><label class="upload-drop" for="photo-input"><span>＋</span><span>Choose a field note</span></label><input id="photo-input" type="file" accept="image/*"><input type="text" placeholder="A short caption" aria-label="A short caption" required><button class="button button-primary" type="submit">Share / earn 50 <span>↗</span></button></form></aside>
      </section>
    </main>
  </div>
  <div class="coin-rain" aria-hidden="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="app.js"></script>
